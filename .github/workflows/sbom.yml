name: SBOM

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  schedule:
    - cron: '0 2 * * 1' # 毎週月曜 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vulnerability scan (npm audit)
        id: audit
        run: |
          python3 - <<'EOF'
          import json, subprocess, os, sys

          result = subprocess.run(
              ["npm", "audit", "--json"],
              capture_output=True, text=True
          )
          try:
              data = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("npm audit output could not be parsed", file=sys.stderr)
              data = {}

          vulns = data.get("vulnerabilities", {})
          counts = {"critical": 0, "high": 0, "moderate": 0, "low": 0}
          for v in vulns.values():
              sev = v.get("severity", "low")
              if sev in counts:
                  counts[sev] += 1

          total = sum(counts.values())
          summary = (
              f"Critical: {counts['critical']}, High: {counts['high']}, "
              f"Moderate: {counts['moderate']}, Low: {counts['low']}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"critical={counts['critical']}\n")
              f.write(f"high={counts['high']}\n")
              f.write(f"summary={summary}\n")

          print(f"Vulnerabilities found: {total}")
          print(summary)

          # Critical または High が存在する場合は失敗
          if counts["critical"] > 0 or counts["high"] > 0:
              print("::error::Critical/High 脆弱性が検出されました。依存パッケージを更新してください。")
              sys.exit(1)
          EOF

      - name: Fetch SBOM from GitHub Dependency Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom \
            --jq '.sbom' > docs/sbom.spdx.json

      - name: Analyze SBOM
        id: analyze
        run: |
          python3 - <<'EOF'
          import json, os, collections

          with open("docs/sbom.spdx.json") as f:
              sbom = json.load(f)

          packages = sbom.get("packages", [])
          total = len(packages)

          licenses = collections.Counter()
          for p in packages:
              lic = p.get("licenseConcluded", "NOASSERTION")
              if lic in ("NOASSERTION", "NONE", ""):
                  lic = "不明"
              licenses[lic] += 1

          top5 = ", ".join(f"{l}: {c}" for l, c in licenses.most_common(5))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"license_summary={top5}\n")
          EOF

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sbom.spdx.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate SBOM [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "SBOM unchanged, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SBOM_CHANGED: ${{ steps.commit.outputs.changed }}
          SBOM_TOTAL: ${{ steps.analyze.outputs.total }}
          SBOM_LICENSES: ${{ steps.analyze.outputs.license_summary }}
          AUDIT_TOTAL: ${{ steps.audit.outputs.total }}
          AUDIT_CRITICAL: ${{ steps.audit.outputs.critical }}
          AUDIT_HIGH: ${{ steps.audit.outputs.high }}
          AUDIT_SUMMARY: ${{ steps.audit.outputs.summary }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL not set, skipping")
              sys.exit(0)

          changed       = os.environ.get("SBOM_CHANGED") == "true"
          sbom_total    = os.environ.get("SBOM_TOTAL", "N/A")
          licenses      = os.environ.get("SBOM_LICENSES", "")
          audit_total   = os.environ.get("AUDIT_TOTAL", "0")
          audit_critical = int(os.environ.get("AUDIT_CRITICAL", "0"))
          audit_high    = int(os.environ.get("AUDIT_HIGH", "0"))
          audit_summary = os.environ.get("AUDIT_SUMMARY", "")
          job_status    = os.environ.get("JOB_STATUS", "success")
          run_url       = os.environ.get("RUN_URL", "")

          if job_status == "failure":
              icon, title = ":rotating_light:", "SBOM チェック失敗 — 脆弱性を検出"
              color = "#FF0000"
          elif int(audit_total) > 0:
              icon, title = ":warning:", "SBOM 更新 — 脆弱性あり (Low/Moderate のみ)"
              color = "#FFA500"
          elif changed:
              icon, title = ":package:", "SBOM を更新しました"
              color = "#36A64F"
          else:
              icon, title = ":white_check_mark:", "SBOM 変更なし・脆弱性ゼロ"
              color = "#36A64F"

          vuln_text = f"*脆弱性:*\n{audit_summary}" if audit_summary else "*脆弱性:*\n検出なし :tada:"

          payload = {
              "text": f"{icon} {title}",
              "blocks": [
                  {
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": f"{icon} *{title}*"},
                  },
                  {
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*パッケージ総数:*\n{sbom_total} 件"},
                          {"type": "mrkdwn", "text": f"*主要ライセンス:*\n{licenses}"},
                          {"type": "mrkdwn", "text": vuln_text},
                      ],
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "ワークフローを見る"},
                              "url": run_url,
                          }
                      ],
                  },
              ],
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(f"Slack response: {r.status}")
          EOF
