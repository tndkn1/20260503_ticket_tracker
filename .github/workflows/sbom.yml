name: SBOM

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  schedule:
    - cron: '0 2 * * 1' # 毎週月曜 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SBOM from GitHub Dependency Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom \
            --jq '.sbom' > docs/sbom.spdx.json

      - name: Analyze SBOM
        id: analyze
        run: |
          python3 - <<'EOF'
          import json, os, collections

          with open("docs/sbom.spdx.json") as f:
              sbom = json.load(f)

          packages = sbom.get("packages", [])
          total = len(packages)

          licenses = collections.Counter()
          for p in packages:
              lic = p.get("licenseConcluded", "NOASSERTION")
              if lic in ("NOASSERTION", "NONE", ""):
                  lic = "不明"
              licenses[lic] += 1

          top5 = ", ".join(f"{l}: {c}" for l, c in licenses.most_common(5))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"license_summary={top5}\n")
          EOF

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sbom.spdx.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate SBOM [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "SBOM unchanged, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SBOM_CHANGED: ${{ steps.commit.outputs.changed }}
          SBOM_TOTAL: ${{ steps.analyze.outputs.total }}
          SBOM_LICENSES: ${{ steps.analyze.outputs.license_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("SLACK_WEBHOOK_URL not set, skipping")
              sys.exit(0)

          changed  = os.environ.get("SBOM_CHANGED") == "true"
          total    = os.environ.get("SBOM_TOTAL", "N/A")
          licenses = os.environ.get("SBOM_LICENSES", "")
          run_url  = os.environ.get("RUN_URL", "")

          if changed:
              icon, title = ":package:", "SBOM を更新しました"
              body = "依存パッケージに変更がありました"
          else:
              icon, title = ":white_check_mark:", "SBOM 変更なし"
              body = "依存パッケージに変更はありませんでした"

          payload = {
              "text": f"{icon} {title}",
              "blocks": [
                  {
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": f"{icon} *{title}*\n{body}"},
                  },
                  {
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*パッケージ総数:*\n{total} 件"},
                          {"type": "mrkdwn", "text": f"*主要ライセンス:*\n{licenses}"},
                      ],
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "ワークフローを見る"},
                              "url": run_url,
                          }
                      ],
                  },
              ],
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print(f"Slack response: {r.status}")
          EOF
